<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Signal lost | Rao Sahil</title>
<meta name="description" content="This page does not exist. Head back to vincent-redex.github.io.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="/assets/style.css?v=2">
<style>
    .error-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding-block: 4rem;
        text-align: center;
    }
    .error-code {
        font-family: var(--display);
        font-size: clamp(4rem, 18vw, 9rem);
        line-height: 1;
        color: var(--red);
        letter-spacing: -0.04em;
        text-shadow: 0 0 40px rgba(255, 0, 60, 0.3);
    }
    .error-title {
        font-family: var(--display);
        font-size: clamp(1rem, 3vw, 1.4rem);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-top: 1.5rem;
    }
    .error-text {
        color: var(--muted);
        max-width: 44ch;
        margin: 0.9rem auto 0;
        font-size: 0.9rem;
    }
    .error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 2rem;
    }
    .error-log {
        margin-top: 2.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
    }
    .error-log span { color: var(--cyan); }
</style>
</head>
<body>
<main class="wrap error-wrap">
    <div>
        <p class="mono-label">// http_status</p>
        <p class="error-code">404</p>
        <h1 class="error-title">Signal lost</h1>
        <p class="error-text">
            The page you asked for isn't here. It may have moved, or it may
            never have existed. Both happen.
        </p>
        <div class="error-actions">
            <a class="btn btn-primary" href="/">Back to index <span class="arrow" aria-hidden="true">&rarr;</span></a>
            <a class="btn btn-ghost" href="https://github.com/VINCENT-REDEX" rel="noopener">GitHub <span class="arrow" aria-hidden="true">&#8599;</span></a>
        </div>
        <p class="error-log">requested path <span data-path>/unknown</span></p>
    </div>
</main>
<script>
    document.querySelector('[data-path]').textContent = location.pathname;
</script>
</body>
</html>
